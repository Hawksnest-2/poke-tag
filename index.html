<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Random Pokémon Card</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      height: 100dvh; 
      width: 100vw;
      margin: 0;
      overflow: hidden;
      padding-top: 15px;
      padding-left: 15px;
      padding-right: 15px;
      padding-bottom: env(safe-area-inset-bottom, 15px); 
      position: relative;
    }

    .card-container {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0; 
      position: relative;
    }

    img {
      max-width: 100%;
      max-height: 60vh; 
      max-height: 60dvh;
      object-fit: contain;
      box-shadow: 0 15px 50px rgba(0,0,0,0.8);
      border-radius: 4.5% / 3.5%;
      transition: transform 0.1s ease;
      z-index: 5;
    }

    #start-screen {
      cursor: pointer;
    }
    #start-screen:active {
      transform: scale(0.95); 
    }

    .fade-in {
      animation: fadeInEffect 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes fadeInEffect {
      from {
        opacity: 0;
        transform: scale(0.85);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    #pokemon-card {
      cursor: default;
      opacity: 0;
    }

    .loader {
      text-align: center;
      color: #aaa;
      font-weight: bold;
    }

    .sparkle {
      position: absolute;
      pointer-events: none;
      z-index: 99;
      animation: magicBurst 1.5s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }

    @keyframes magicBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) translate(0, 0) scale(1) rotate(0deg);
      }
      30% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) translateY(120px) scale(0) rotate(540deg);
      }
    }

    .footer-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 15px;
      flex-shrink: 0;
      z-index: 10;
    }

    .button-row {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .download-btn {
      padding: 12px 20px;
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      text-decoration: none;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      white-space: nowrap;
    }

    .download-btn:disabled {
      background-color: rgba(255, 255, 255, 0.05);
      color: #777;
      border-color: rgba(255, 255, 255, 0.1);
      cursor: not-allowed;
    }

    .stats-text {
      font-size: 0.85rem;
      color: #aaa;
      margin: 0;
      letter-spacing: 0.5px;
    }

    #pdf-view-screen {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 0;
      z-index: 20;
    }

    .pdf-frame {
      width: 100%;
      flex: 1;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background-color: #111;
      margin-bottom: 15px;
    }

    .back-btn-container {
      width: 100%;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <audio id="catch-sound" src="./catch.mp3" preload="auto"></audio>

  <!-- MAIN ENGINE SCREEN CARD CONTAINER -->
  <div id="card-wrapper" class="card-container">
    <img id="start-screen" 
         src="./30th_Celebration/Start_30th_Celebration.jpg" 
         alt="Start Celebration Engine" 
         onclick="drawRandomCard()" />

    <div id="loading-status" class="loader" style="display: none;">
      <h2>⚡ Catching...</h2>
    </div>

    <img id="pokemon-card" src="" alt="Pokémon Card" style="display: none;" />
  </div>

  <!-- INTERACTIVE OVERLAY PDF SCREEN -->
  <div id="pdf-view-screen" style="display: none;">
    <iframe class="pdf-frame" src="./30th_Celebration/Card_List_30th_Celebration.pdf"></iframe>
    <div class="back-btn-container">
      <button class="download-btn" onclick="closePdfViewer()">⬅ Back to Game</button>
    </div>
  </div>

  <!-- MAIN BOTTOM FOOTER WRAPPER -->
  <div id="footer-navigation" class="footer-wrapper">
    <div class="button-row">
      <button id="catch-btn" class="download-btn" onclick="collectCurrentCard()" style="display: none;">🔴 Catch Card</button>
      <button id="save-btn" class="download-btn" onclick="saveCardToPhone()" style="display: none;">💾 Save Image</button>
      <button id="view-pdf-btn" class="download-btn" onclick="openPdfViewer()">📄 View List (PDF)</button>
    </div>
    <p id="collection-stats" class="stats-text">Collected: 0 / 196</p>
  </div>
  <script>
    // TRACKING STATE GLOBALLY
    var currentCardFile = "";
    var currentUploadedTotal = 196;
    var targetFolder = "30th_Celebration";

    // Load initial collection from local phone storage safely
    var caughtCollection = [];
    try {
      var saved = localStorage.getItem('myPokemonCollection');
      if (saved) caughtCollection = JSON.parse(saved);
    } catch(e) {
      console.log("Storage access error", e);
    }

    // Update the counter text on load
    function updateStatsCounter() {
      var counterEl = document.getElementById('collection-stats');
      if (counterEl) {
        counterEl.innerText = "Collected: " + caughtCollection.length + " / " + currentUploadedTotal;
      }
    }
    updateStatsCounter();

    function launchHugeCelebration() {
      var container = document.getElementById("card-wrapper");
      var particleCount = 60; 

      for (var i = 0; i < particleCount; i++) {
        var sparkle = document.createElement("div");
        sparkle.classList.add("sparkle");

        var colors = [
          { main: "#ffd700", glow: "rgba(255, 215, 0, 0.9)" },
          { main: "#00f0ff", glow: "rgba(0, 240, 255, 0.9)" },
          { main: "#ff007f", glow: "rgba(255, 0, 127, 0.9)" },
          { main: "#ffffff", glow: "rgba(255, 255, 255, 0.9)" }
        ];
        var config = colors[Math.floor(Math.random() * colors.length)];
        
        sparkle.style.backgroundColor = config.main;
        sparkle.style.boxShadow = "0 0 15px " + config.glow + ", 0 0 30px " + config.glow;

        if (Math.random() > 0.5) {
          sparkle.style.borderRadius = "0%";
          sparkle.style.transform = "rotate(" + (Math.random() * 360) + "deg)"; 
        } else {
          sparkle.style.borderRadius = "50%";
        }

        var size = Math.floor(Math.random() * 16) + 8;
        sparkle.style.width = size + "px";
        sparkle.style.height = size + "px";

        var angle = Math.random() * Math.PI * 2;
        var velocity = 150 + Math.random() * 230; 
        var dx = Math.cos(angle) * velocity + "px";
        var dy = Math.sin(angle) * velocity + "px";

        sparkle.style.setProperty("--dx", dx);
        sparkle.style.setProperty("--dy", dy);

        sparkle.style.left = "50%";
        sparkle.style.top = "50%";
        sparkle.style.animationDelay = (Math.random() * 0.2) + "s";

        container.appendChild(sparkle);
        cleanUpSparkle(sparkle);
      }
    }

    function cleanUpSparkle(element) {
      setTimeout(function() {
        if (element && element.parentNode) {
          element.parentNode.removeChild(element);
        }
      }, 1700);
    }

    function drawRandomCard() {
      var catchSound = document.getElementById("catch-sound");

      if (catchSound) {
        catchSound.play().then(function() {
          catchSound.pause();
          catchSound.currentTime = 0;
        }).catch(function(e) {
          console.log("Pre-activation skipped", e);
        });
      }

      document.getElementById("start-screen").style.display = "none";
      document.getElementById("pokemon-card").style.display = "none";
      document.getElementById("loading-status").style.display = "block";
      
      var randomNumber = Math.floor(Math.random() * currentUploadedTotal) + 1;
      var paddedNumber = String(randomNumber).padStart(4, '0');
      currentCardFile = paddedNumber + ".png";
      
      var imgElement = document.getElementById("pokemon-card");
      imgElement.src = "./" + targetFolder + "/" + currentCardFile;
      
      imgElement.onload = function() {
        document.getElementById("loading-status").style.display = "none";
        
        if (catchSound) {
          catchSound.play().catch(function(error) {
            console.log("Audio blocked: ", error);
          });
        }

        imgElement.style.display = "block";
        imgElement.classList.add("fade-in");
        
        var catchBtn = document.getElementById("catch-btn");
        var saveBtn = document.getElementById("save-btn");
        
        if (catchBtn) {
          catchBtn.style.display = "inline-block";
          if (caughtCollection.includes(currentCardFile)) {
            catchBtn.innerText = "✨ Caught";
            catchBtn.disabled = true;
          } else {
            catchBtn.innerText = "🔴 Catch Card";
            catchBtn.disabled = false;
          }
        }
        if (saveBtn) saveBtn.style.display = "inline-block";

        launchHugeCelebration();
      };
    }

    function collectCurrentCard() {
      if (!currentCardFile) return;

      if (!caughtCollection.includes(currentCardFile)) {
        caughtCollection.push(currentCardFile);
        try {
          localStorage.setItem('myPokemonCollection', JSON.stringify(caughtCollection));
        } catch(e) {
          console.log("Failed to write to local storage", e);
        }
        
        var catchBtn = document.getElementById("catch-btn");
        if (catchBtn) {
          catchBtn.innerText = "✨ Caught";
          catchBtn.disabled = true;
        }
        updateStatsCounter();
      }
    }

    function saveCardToPhone() {
      if (!currentCardFile) return;
      
      var imgElement = document.getElementById("pokemon-card");
      if (!imgElement || !imgElement.src) return;

      var targetUrl = imgElement.src;
      var link = document.createElement('a');
      link.href = targetUrl;
      link.download = currentCardFile;
      link.target = "_blank"; 
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function openPdfViewer() {
      document.getElementById("card-wrapper").style.display = "none";
      document.getElementById("footer-navigation").style.display = "none";
      document.getElementById("pdf-view-screen").style.display = "flex";
    }

    function closePdfViewer() {
      document.getElementById("pdf-view-screen").style.display = "none";
      document.getElementById("card-wrapper").style.display = "flex";
      document.getElementById("footer-navigation").style.display = "flex";
    }
  </script>
</body>
</html>
