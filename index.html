<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>30th Celebration Collection</title>

<script src="cardData.js"></script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:auto;
  padding-bottom:80px;
}
.card-container{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  padding:10px;
  position:relative;
}

#pokemon-card,
#start-screen{
  max-width:100%;
  max-height:45vh;
  object-fit:contain;
  box-shadow:0 15px 50px rgba(0,0,0,.8);
}

#footer-navigation{
  position:fixed;
  bottom: max(10px, env(safe-area-inset-bottom));
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
  z-index:1000;
  pointer-events: none;
}

#footer-navigation .download-btn{
  pointer-events: auto;
}

#start-screen{
  cursor:pointer;
}

#card-info{
  margin-top:6px;
  margin-bottom:6px;
  text-align:center;
  display:none;
}

#card-name{
  font-size:1.25rem;
  font-weight:bold;
  margin-bottom:2px;
}

#card-number{
  margin-top:4px;
  color:#ccc;
}

#card-rarity{
  margin-top:6px;
  font-weight:bold;
}

#collection-status{
  margin-top:4px;
  font-weight:bold;
}

.button-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin:4px;
}

.download-btn{
  padding:16px 30px;
  border-radius:30px;
  border:none;
  cursor:pointer;
  color:#fff;
  background:rgba(255,255,255,.20);
  font-size:1rem;
  font-weight:bold;
}

.loader{
  display:none;
}

.fade-in{
  animation:fadeIn .5s ease forwards;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:scale(.85);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

/* Binder */

#binder-header{
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#000;
  padding:10px 12px;

  border-bottom:1px solid rgba(255,255,255,.15);
}

#binder-header h2{
  margin:0;
  font-size:1.2rem;
}

#binder-counter{
font-weight:bold;
color:#ddd;
font-size:.95rem;
}

#binder-summary{
  position:sticky;
  top:65px;

  background:#000;

  text-align:center;

  padding:8px;

  z-index:999;
}

#binder-screen{
  display:none;
  flex:1;
  overflow-y:auto;
  width:100%;
  padding:10px;
}

#binder-grid{
  display:grid;
  grid-template-columns:
      repeat(auto-fill,minmax(90px,1fr));
  gap:6px;
}

.binder-card{
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  padding:6px;
  text-align:center;
  background:#111;
}

.binder-card img{
  width:100%;
  border-radius:6px;
}

.small{
  font-size:.65rem;
}

#pdf-view-screen{
  display:none;
  width:100%;
  flex:1;
  flex-direction:column;
}

.pdf-frame{
  flex:1;
  width:100%;
}

.rarity-common{color:#b6b6b6;}
.rarity-rare{color:#ffffff;}
.rarity-double{color:#ffffff;}
.rarity-ir{color:#f6c343;}
.rarity-sir{color:#ffdf6b;}
.rarity-pika{color:#ffd400;}
.rarity-future{color:#59d7c4;}
.rarity-classic{color:#dddddd;}

.sparkle{
  position:absolute;
  pointer-events:none;
  z-index:99;
  animation:magicBurst 1.5s forwards;
}

@keyframes magicBurst{
  from{
    opacity:1;
    transform:translate(-50%,-50%);
  }
  to{
    opacity:0;
    transform:
      translate(-50%,-50%)
      translate(var(--dx),var(--dy))
      scale(0);
  }
}

</style>
</head>

<body>

<audio id="catch-sound"
       src="./catch.mp3"
       preload="auto"></audio>

<div id="card-wrapper" class="card-container">

<img id="start-screen"
  src="./30th_Celebration/Start_30th_Celebration.jpg"
  alt="Start Celebration Engine"
  onclick="drawRandomCard()">

  <div id="loading-status" class="loader">
    <h2>⚡ Catching...</h2>
  </div>

  <img id="pokemon-card"
       alt="Pokemon Card"
       style="display:none;">

  <div id="card-info">
      <div id="card-name"></div>
      <div id="card-number"></div>
      <div id="card-rarity"></div>
      <div id="collection-status"></div>
  </div>
</div>

<div id="binder-screen">
  <div id="binder-header">
      <button class="download-btn"
              onclick="closeBinder()">
          ⬅ Back
      </button>
      <h2>My Collection</h2>
      <div id="binder-counter">
          0/196
      </div>
  </div>

  <div id="binder-grid"></div>

  <div class="button-row">
      <button class="download-btn"
              onclick="resetCollection()">
          ⚠️ Reset Collection
      </button>
  </div>
</div>


<div id="footer-navigation"
     class="button-row">
  <button class="download-btn"
          onclick="viewCollection()">
      📚 My Collection
  </button>
</div>

<div id="card-modal"
     style="
       display:none;
       position:fixed;
       inset:0;
       background:rgba(0,0,0,.95);
       z-index:9999;
       justify-content:center;
       align-items:center;
       flex-direction:column;">
    <img id="modal-card-image"
         style="
           max-width:95%;
           max-height:80vh;
           object-fit:contain;">
    <button class="download-btn"
            onclick="closeCardModal()"
            style="margin-top:15px;">
        Close
    </button>

</div>

<script>

const TOTAL_CARDS = 196;
const FOLDER = "30th_Celebration";

function getCollection() {
    return JSON.parse(
        localStorage.getItem("pokemonCollection") || "[]"
    );
}

function saveCollection(collection){
    localStorage.setItem(
        "pokemonCollection",
        JSON.stringify(collection)
    );
}

function getRarityBadge(rarity){
    switch(rarity){
        case "Common":
            return "●";
        case "Rare":
            return "★";
        case "Double Rare":
            return "★★";
        case "Illustration Rare":
            return "⭐";
        case "Special Illustration Rare":
            return "⭐⭐";
        case "Pikachu Rare":
            return "❤";
        case "Futuristic Rare":
            return "✦";
        case "Classic Collection":
            return "★C";
        default:
            return "";
    }
}

function drawRandomCard(){

    const audio =
      document.getElementById(
        "catch-sound"
      );

    audio.currentTime = 0;

    audio.play().catch(err =>
      console.log("Audio:", err)
    );

    let randomId =
        Math.floor(Math.random() * TOTAL_CARDS) + 1;

    let fileName =
        String(randomId)
          .padStart(4,'0') + ".png";
    let card =
        cardData[randomId];
    let collection =
        getCollection();
    let isNew =
        !collection.includes(randomId);
    if(isNew){
        collection.push(randomId);
        saveCollection(collection);
    }
    const cardImg =
      document.getElementById("pokemon-card");
    cardImg.style.display = "none";
    cardImg.src =
      "./"+FOLDER+"/"+fileName;
    document.getElementById(
      "loading-status"
    ).style.display = "block";
    cardImg.onload = function(){

cardImg.style.display="block";
cardImg.classList.remove("fade-in");
void cardImg.offsetWidth;
cardImg.classList.add("fade-in");
      document.getElementById(
        "loading-status"
      ).style.display = "none";
      document.getElementById(
        "start-screen"
      ).style.display="none";
      document.getElementById(
        "card-info"
      ).style.display="block";
      document.getElementById(
        "card-name"
      ).textContent =
        card.name;
      document.getElementById(
        "card-number"
      ).innerHTML =
        "#" +
        card.cardNumber +
        " • " +
        getRarityBadge(card.rarity) +
        " " +
        card.rarity;
      document.getElementById(
        "card-rarity"
      ).style.display = "none";

      let total =
        collection.length;
      document.getElementById(
        "collection-status"
      ).innerHTML =
        (isNew
          ? "🎉 NEW CARD COLLECTED"
          : "✅ Already Collected")
        +"<br>"
        + total +" / "
        + TOTAL_CARDS
        +" Collected";
      launchHugeCelebration();
    };
}

function buildBinder(){
    const grid =
      document.getElementById("binder-grid");
    grid.innerHTML="";
    const collection =
      getCollection();
    for(let i=1;i<=TOTAL_CARDS;i++){
        const card =
          cardData[i];
        const owned =
          collection.includes(i);
        const file =
          String(i)
          .padStart(4,"0")
          + ".png";
        const div =
          document.createElement("div");
        div.className =
          "binder-card";
        div.innerHTML = `
          <img
            src="${
               owned
                ? './' + FOLDER + '/' + file
                : './' + FOLDER + '/card-back.jpg'
            }">
          <div class="small">
            #${card.cardNumber}
          </div>
          <div class="small">
            ${card.name}
          </div>
          <div class="small">
            ${getRarityBadge(card.rarity)}
          </div>
          `;
          if(owned){
             div.style.cursor = "pointer";
             div.onclick = function(){
                openCardModal(i);       
             };
          }
        grid.appendChild(div);
            }
        document.getElementById(
          "binder-counter"
        ).textContent =
          collection.length +
          "/" +
          TOTAL_CARDS;
        }

function viewCollection(){
    buildBinder();
    document.getElementById(
      "card-wrapper"
    ).style.display="none";
    document.getElementById(
      "footer-navigation"
    ).style.display="none";
    document.getElementById(
      "binder-screen"
    ).style.display="block";
}

function openCardModal(cardId){
    let file =
      String(cardId)
      .padStart(4,"0")
      + ".png";
    document.getElementById(
      "modal-card-image"
    ).src = "./" + FOLDER + "/" + file;
    document.getElementById(
      "card-modal"
    ).style.display = "flex";
}

function closeCardModal(){
    document.getElementById(
      "card-modal"
    ).style.display = "none";
}

function closeBinder(){
    document.getElementById(
      "binder-screen"
    ).style.display="none";
    document.getElementById(
      "card-wrapper"
    ).style.display="flex";
    document.getElementById(
      "footer-navigation"
    ).style.display="flex";
}

function resetCollection(){

    if (
        confirm(
            "⚠️ This will erase your entire collection.\n\nContinue?"
        )
    ){

        localStorage.removeItem(
            "pokemonCollection"
        );

        buildBinder();
    }
}

function launchHugeCelebration(){
    const container =
      document.getElementById(
        "card-wrapper"
      );
    for(let i=0;i<40;i++){
        const s =
          document.createElement("div");
        s.className="sparkle";
        s.style.background =
          ["#ffd700",
           "#00f0ff",
           "#ff007f",
           "#ffffff"]
           [Math.floor(Math.random()*4)];
        s.style.width="10px";
        s.style.height="10px";
        s.style.borderRadius="50%";
        s.style.left="50%";
        s.style.top="50%";
        s.style.setProperty(
          "--dx",
          (Math.random()*400-200)+"px"
        );
        s.style.setProperty(
          "--dy",
          (Math.random()*400-200)+"px"
        );
        container.appendChild(s);
        setTimeout(()=>{
            s.remove();
        },1500);
    }
}
</script>
</body>
</html>
