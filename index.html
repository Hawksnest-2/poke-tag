<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Random Pokémon Card</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* Evenly spaces card at top/center and button clearly above the bottom */
      align-items: center;
      height: 100vh;
      height: 100dvh; 
      width: 100vw;
      margin: 0;
      overflow: hidden;
      
      /* HEAVY MOBILE SAFETY BUFFER: Forces everything up away from mobile bottom navigation toolbars */
      padding-top: 20px;
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: env(safe-area-inset-bottom, 50px); 
    }

    .card-container {
      width: 100%;
      flex: 1; /* Automatically takes up all available top space */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0; 
    }

    img {
      max-width: 100%;
      /* Aggressive height restriction: guarantees the image shrinks enough to expose the button below it */
      max-height: 65vh; 
      max-height: 65dvh;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border-radius: 4.5% / 3.5%;
      transition: transform 0.1s ease;
    }

    #start-screen:active, #pokemon-card:active {
      transform: scale(0.97); 
    }

    .loader {
      text-align: center;
      color: #aaa;
      font-weight: bold;
    }

    /* Standard block layout - no longer fixed or floating over the bottom edge */
    .footer-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 20px;
      margin-bottom: 20px; /* Pushes it up from the padding boundary */
      flex-shrink: 0; /* Prevents the button area from compressing */
    }

    .download-btn {
      padding: 14px 28px; /* Slightly larger text and padding for easy thumb tapping */
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      text-decoration: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
  </style>
  <script>
    function drawRandomCard() {
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("pokemon-card").style.display = "none";
      document.getElementById("loading-status").style.display = "block";

      var currentUploadedTotal = 196; 
      var targetFolder = "30th_Celebration"; 
      
      var randomNumber = Math.floor(Math.random() * currentUploadedTotal) + 1;
      var paddedNumber = String(randomNumber).padStart(4, '0');
      var imageFilename = paddedNumber + ".png";
      
      var imgElement = document.getElementById("pokemon-card");
      imgElement.src = "./" + targetFolder + "/" + imageFilename;
      
      imgElement.onload = function() {
        document.getElementById("loading-status").style.display = "none";
        imgElement.style.display = "block";
      };
    }
  </script>
</head>
<body>

  <!-- 1. The top container dynamically shrinks to fit screen constraints -->
  <div class="card-container">
    <img id="start-screen" 
         src="./30th_Celebration/Start_30th_Celebration.jpg" 
         alt="Start Celebration Engine" 
         onclick="drawRandomCard()" />

    <div id="loading-status" class="loader" style="display: none;">
      <h2>⚡ Catching...</h2>
    </div>

    <img id="pokemon-card" src="" alt="Pokémon Card" style="display: none;" onclick="drawRandomCard()" />
  </div>

  <!-- 2. The bottom wrapper sits inline, strictly above the navigation bar zones -->
  <div class="footer-wrapper">
    <a class="download-btn" href="./30th_Celebration/Card_List_30th_Celebration.pdf" download>
      📄 Download Card List (PDF)
    </a>
  </div>

</body>
</html>
