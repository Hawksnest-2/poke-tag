<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Random Pokémon Card</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      height: 100dvh; 
      width: 100vw;
      margin: 0;
      overflow: hidden;
      padding-top: 20px;
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: env(safe-area-inset-bottom, 50px); 
      position: relative;
    }

    .card-container {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0; 
      position: relative;
    }

    img {
      max-width: 100%;
      max-height: 65vh; 
      max-height: 65dvh;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border-radius: 4.5% / 3.5%;
      transition: transform 0.1s ease;
      z-index: 5; /* Keeps image safely on top */
    }

    #start-screen {
      cursor: pointer;
    }
    #start-screen:active {
      transform: scale(0.97); 
    }

    .fade-in {
      animation: fadeInEffect 0.6s ease-out forwards;
    }

    @keyframes fadeInEffect {
      from {
        opacity: 0;
        transform: scale(0.93);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    #pokemon-card {
      cursor: default;
      opacity: 0;
    }

    .loader {
      text-align: center;
      color: #aaa;
      font-weight: bold;
    }

    /* 1. UPDATED BULLETPROOF SPARKLE STYLES */
    .sparkle {
      position: absolute;
      pointer-events: none;
      z-index: 99; /* Forces sparkles to render completely in front of everything */
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      animation: sparkleFade 0.8s linear forwards;
    }

    @keyframes sparkleFade {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0.2);
      }
    }

    .footer-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 20px;
      margin-bottom: 20px;
      flex-shrink: 0;
      z-index: 10;
    }

    .download-btn {
      padding: 14px 28px;
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      text-decoration: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
  </style>
  <script>
    // 2. RE-ENGINEERED OUTWARD PARTICLE ENGINE
    function launchSparkles() {
      var container = document.getElementById("card-wrapper");
      
      // Spawn 45 distinct particles for a dense, highly visible burst
      var particleCount = 45; 

      for (var i = 0; i < particleCount; i++) {
        var sparkle = document.createElement("div");
        sparkle.classList.add("sparkle");

        // Randomly alternate colors between vivid magic gold, crisp white, and neon cyan
        var colorPool = ["#ffd700", "#ffffff", "#00f0ff"];
        var randomColor = colorPool[Math.floor(Math.random() * colorPool.length)];
        sparkle.style.backgroundColor = randomColor;
        
        if (randomColor !== "#ffffff") {
          sparkle.style.boxShadow = "0 0 8px " + randomColor;
        }

        // Randomize dimensions to look like natural debris shards (between 6px and 14px)
        var size = Math.floor(Math.random() * 8) + 6;
        sparkle.style.width = size + "px";
        sparkle.style.height = size + "px";

        // Generate wide outward explosion coordinates over cellular viewport frames
        var angle = Math.random() * Math.PI * 2;
        var velocity = 100 + Math.random() * 150; // Radical flight path radius (up to 250px outward)
        var dx = Math.cos(angle) * velocity + "px";
        var dy = Math.sin(angle) * velocity + "px";

        sparkle.style.setProperty("--dx", dx);
        sparkle.style.setProperty("--dy", dy);

        // Explicitly target the geometric screen center of the card frame container
        sparkle.style.left = "50%";
        sparkle.style.top = "50%";
        sparkle.style.transform = "translate(-50%, -50%)";

        // Distribute execution timeline pacing fractions
        sparkle.style.animationDelay = (Math.random() * 0.1) + "s";

        container.appendChild(sparkle);

        // Self-delete once dropped from the viewport grid view
        cleanUpSparkle(sparkle);
      }
    }

    function cleanUpSparkle(element) {
      setTimeout(function() {
        if (element && element.parentNode) {
          element.parentNode.removeChild(element);
        }
      }, 1000);
    }

    function drawRandomCard() {
      var catchSound = document.getElementById("catch-sound");

      catchSound.play().then(function() {
        catchSound.pause();
        catchSound.currentTime = 0;
      }).catch(function(e) {
        console.log("Pre-activation skipped", e);
      });

      document.getElementById("start-screen").style.display = "none";
      document.getElementById("pokemon-card").style.display = "none";
      document.getElementById("loading-status").style.display = "block";

      var currentUploadedTotal = 196; 
      var targetFolder = "30th_Celebration"; 
      
      var randomNumber = Math.floor(Math.random() * currentUploadedTotal) + 1;
      var paddedNumber = String(randomNumber).padStart(4, '0');
      var imageFilename = paddedNumber + ".png";
      
      var imgElement = document.getElementById("pokemon-card");
      imgElement.src = "./" + targetFolder + "/" + imageFilename;
      
      imgElement.onload = function() {
        document.getElementById("loading-status").style.display = "none";
        
        catchSound.play().catch(function(error) {
          console.log("Audio blocked: ", error);
        });

        imgElement.style.display = "block";
        imgElement.classList.add("fade-in");

        // 3. LAUNCH FIREWORK EFFECT
        launchSparkles();
      };
    }
  </script>
</head>
<body>

  <audio id="catch-sound" src="./catch.mp3" preload="auto"></audio>

  <div id="card-wrapper" class="card-container">
    <img id="start-screen" 
         src="./30th_Celebration/Start_30th_Celebration.jpg" 
         alt="Start Celebration Engine" 
         onclick="drawRandomCard()" />

    <div id="loading-status" class="loader" style="display: none;">
      <h2>⚡ Catching...</h2>
    </div>

    <img id="pokemon-card" src="" alt="Pokémon Card" style="display: none;" />
  </div>

  <div class="footer-wrapper">
    <a class="download-btn" href="./30th_Celebration/Card_List_30th_Celebration.pdf" download>
      📄 Download Card List (PDF)
    </a>
  </div>

</body>
</html>
