//index.html with a link to download the cardlist


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Pokémon Card</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column; /* Stack the image and the button vertically */
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      margin: 0;
      overflow: hidden;
      position: relative;
    }
    .card-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 85vh; /* Leave room for the button at the bottom */
      width: 100%;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .loader {
      text-align: center;
      color: #888;
    }
    .download-btn {
      margin-bottom: 20px;
      padding: 10px 20px;
      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      text-decoration: none;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }
    .download-btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.5);
    }
  </style>
  <script>
    window.onload = function() {
      // 1. Updated to match your exact celebration file count
      var currentUploadedTotal = 196; 
      
      // 2. Instantly choose a random card number between 1 and 196
      var randomNumber = Math.floor(Math.random() * currentUploadedTotal) + 1;
      var paddedNumber = String(randomNumber).padStart(4, '0');
      var imageFilename = paddedNumber + ".png";
      
      // 3. TARGET FOLDER: Updated to your new celebration folder
      var targetFolder = "30th_Celebration"; 
      
      // 4. Construct the path (e.g., ./30th_Celebration/0142.png)
      var imgElement = document.getElementById("pokemon-card");
      imgElement.src = "./" + targetFolder + "/" + imageFilename;
      
      // 5. Hide the loader status and display the native card frame
      document.getElementById("loading-status").style.display = "none";
      imgElement.style.display = "block";
    };
  </script>
</head>
<body>

  <div class="card-container">
    <div id="loading-status" class="loader">
      <h2>⚡ Drawing Card...</h2>
    </div>

    <img id="pokemon-card" src="" alt="Pokémon Card" style="display: none;" />
  </div>

  <!-- Download Link pointing to your PDF inside the folder -->
  <a class="download-btn" href="./30th_Celebration/Card_List_30th_Celebration.pdf" download>
    📄 Download Card List (PDF)
  </a>

</body>
</html>
