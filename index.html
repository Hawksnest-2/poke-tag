<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Random Pokémon Card</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      height: 100dvh; 
      width: 100vw;
      margin: 0;
      overflow: hidden;
      padding-top: 15px;
      padding-left: 15px;
      padding-right: 15px;
      padding-bottom: env(safe-area-inset-bottom, 15px); 
      position: relative;
    }

    .card-container {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0; 
      position: relative;
    }

    img {
      max-width: 100%;
      max-height: 60vh; 
      max-height: 60dvh;
      object-fit: contain;
      box-shadow: 0 15px 50px rgba(0,0,0,0.8);
      border-radius: 4.5% / 3.5%;
      transition: transform 0.1s ease;
      z-index: 5; /* Card stays perfectly framed in the center layer */
    }

    #start-screen {
      cursor: pointer;
    }
    #start-screen:active {
      transform: scale(0.95); 
    }

    /* SMOOTH ZOOP FADE-IN */
    .fade-in {
      animation: fadeInEffect 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes fadeInEffect {
      from {
        opacity: 0;
        transform: scale(0.85); /* Exaggerated pop-in scale transition */
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    #pokemon-card {
      cursor: default;
      opacity: 0;
    }

    .loader {
      text-align: center;
      color: #aaa;
      font-weight: bold;
    }

    /* 1. UPGRADED MAGICAL CELEBRATION SPARKLES */
    .sparkle {
      position: absolute;
      pointer-events: none;
      z-index: 99; /* Forces particles to overlay cleanly over the card face */
      animation: magicBurst 1.5s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }

    @keyframes magicBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) translate(0, 0) scale(1) rotate(0deg);
      }
      /* 30% of the timeline is the violent explosion outward */
      30% {
        opacity: 1;
      }
      /* Remaining 70% simulates drifting gravity and slow atmospheric decay */
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) translateY(120px) scale(0) rotate(540deg);
      }
    }

    /* NEW CONTROL ACTIONS UI CONTAINER */
    .action-container {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      z-index: 15;
    }

    .footer-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
      margin-bottom: 15px;
      flex-shrink: 0;
      z-index: 10;
    }

    .download-btn {
      padding: 14px 28px;
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      text-decoration: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    .download-btn:disabled {
      background-color: rgba(255, 255, 255, 0.05);
      color: #888888;
      border-color: rgba(255, 255, 255, 0.1);
      cursor: not-allowed;
    }

    .stats-counter {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
      margin: 0;
    }

    /* PERFECT SCREEN-FITTED CONTROLS */
    #pdf-view-screen {
      width: 100%;
      flex: 1; /* Automatically consumes the exact middle screen territory */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 0; /* Important: allows layout contraction on small mobile viewport */
      z-index: 20;
    }

    .pdf-frame {
      width: 100%;
      flex: 1; /* Automatically occupies maximum height room above back button */
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background-color: #111;
      margin-bottom: 15px;
    }

    .back-btn-container {
      width: 100%;
      display: flex;
      justify-content: center;
      flex-shrink: 0; /* Stops the button from shrinking out of view */
      margin-bottom: 15px;
    }
  </style>
  <script>
    // Global tracking variables
    var currentImageFilename = "";
    var currentUploadedTotal = 196; 
    var targetFolder = "30th_Celebration"; 

    // Initialize local storage array safely
    var caughtCollection = JSON.parse(localStorage.getItem('pokemon_checklist_30th')) || [];

    // 2. GIANT FIREWORK CELEBRATION DISPENSER
    function launchHugeCelebration() {
      var container = document.getElementById("card-wrapper");
      var particleCount = 60; 

      for (var i = 0; i < particleCount; i++) {
        var sparkle = document.createElement("div");
        sparkle.classList.add("sparkle");

        var colors = [
          { main: "#ffd700", glow: "rgba(255, 215, 0, 0.9)" },
          { main: "#00f0ff", glow: "rgba(0, 240, 255, 0.9)" },
          { main: "#ff007f", glow: "rgba(255, 0, 127, 0.9)" },
          { main: "#ffffff", glow: "rgba(255, 255, 255, 0.9)" }
        ];
        var config = colors[Math.floor(Math.random() * colors.length)];
        
        sparkle.style.backgroundColor = config.main;
        sparkle.style.boxShadow = "0 0 15px " + config.glow + ", 0 0 30px " + config.glow;

        if (Math.random() > 0.5) {
          sparkle.style.borderRadius = "0%";
          sparkle.style.transform = "rotate(" + (Math.random() * 360) + "deg)"; 
        } else {
          sparkle.style.borderRadius = "50%";
        }

        var size = Math.floor(Math.random() * 16) + 8;
        sparkle.style.width = size + "px";
        sparkle.style.height = size + "px";

        var angle = Math.random() * Math.PI * 2;
        var velocity = 150 + Math.random() * 230; 
        var dx = Math.cos(angle) * velocity + "px";
        var dy = Math.sin(angle) * velocity + "px";

        sparkle.style.setProperty("--dx", dx);
        sparkle.style.setProperty("--dy", dy);

        sparkle.style.left = "50%";
        sparkle.style.top = "50%";
        sparkle.style.animationDelay = (Math.random() * 0.2) + "s";

        container.appendChild(sparkle);
        cleanUpSparkle(sparkle);
      }
    }

    function cleanUpSparkle(element) {
      setTimeout(function() {
        if (element && element.parentNode) {
          element.parentNode.removeChild(element);
        }
      }, 1700);
    }

    function drawRandomCard() {
      var catchSound = document.getElementById("catch-sound");

      catchSound.play().then(function() {
        catchSound.pause();
        catchSound.currentTime = 0;
      }).catch(function(e) {
        console.log("Pre-activation skipped", e);
      });

      document.getElementById("start-screen").style.display = "none";
      document.getElementById("pokemon-card").style.display = "none";
      document.getElementById("action-controls").style.display = "none";
      document.getElementById("loading-status").style.display = "block";
      
      var randomNumber = Math.floor(Math.random() * currentUploadedTotal) + 1;
      var paddedNumber = String(randomNumber).padStart(4, '0');
      currentImageFilename = paddedNumber + ".png";
      
      var imgElement = document.getElementById("pokemon-card");
      imgElement.src = "./" + targetFolder + "/" + currentImageFilename;
      
      imgElement.onload = function() {
        document.getElementById("loading-status").style.display = "none";
        
        catchSound.play().catch(function(error) {
          console.log("Audio blocked: ", error);
        });

        imgElement.style.display = "block";
        imgElement.classList.add("fade-in");
        
        // Update Checklist Buttons UI state for the newly loaded card
        updateChecklistButtonState();
        document.getElementById("action-controls").style.display = "flex";

        // 3. BLAST THE SCREEN
        launchHugeCelebration();
      };
    }

    // UPDATES THE BUTTON TO REFLECT IF CARD INDEED SAVED BEFORE
    function updateChecklistButtonState() {
      var collectBtn = document.getElementById("collect-card-btn");
      if (caughtCollection.includes(currentImageFilename)) {
        collectBtn.innerText = "✨ Already Caught!";
        collectBtn.disabled = true;
      } else {
        collectBtn.innerText = "🔴 Catch / Collect";
        collectBtn.disabled = false;
      }
      updateStatsUI();
    }

    // SAVES THE CARD FILE REF INTO PHONE LOCAL STORAGE
    function collectCurrentCard() {
      if (!currentImageFilename) return;
      
      if (!caughtCollection.includes(currentImageFilename)) {
        caughtCollection.push(currentImageFilename);
        localStorage.setItem('pokemon_checklist_30th', JSON.stringify(caughtCollection));
        updateChecklistButtonState();
      }
    }

    // DOWNLOAD ACTION TO PHONE WEB/APP RUNTIME
    function downloadCurrentCardImage() {
      if (!currentImageFilename) return;
      var imgElement = document.getElementById("pokemon-card");
      
      var tempLink = document.createElement('a');
      tempLink.href = imgElement.src;
      tempLink.download = "Pokemon_Card_" + currentImageFilename;
      document.body.appendChild(tempLink);
      tempLink.click();
      document.body.removeChild(tempLink);
    }

    // COUNTER PROGRESS DISPLAY VALUE ADJUSTER
    function updateStatsUI() {
