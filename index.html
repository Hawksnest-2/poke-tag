<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Random Pokémon Card</title>
  <style>
    /* Mobile app reset */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* Removes the ugly blue flash on tap */
    }
    
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh; /* Adapts to Safari/Chrome address bars */
      width: 100vw;
      margin: 0;
      overflow: hidden;
      padding: 20px;
    }

    .card-container {
      width: 100%;
      height: 100%;
      max-height: calc(100dvh - 100px); /* Saves clear vertical room for the bottom button */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border-radius: 4.5% / 3.5%; /* Mimics the natural rounded corners of a physical card */
      transition: transform 0.1s ease;
    }

    /* Interactive tap feedback */
    #start-screen:active, #pokemon-card:active {
      transform: scale(0.97); 
    }

    .loader {
      text-align: center;
      color: #aaa;
      font-weight: bold;
    }

    /* Fixed bottom navigation for quick mobile access */
    .footer-wrapper {
      position: fixed;
      bottom: 24px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 10;
    }

    .download-btn {
      padding: 12px 24px;
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      text-decoration: none;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px); /* Gives a premium frosted-glass effect */
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
  </style>
  <script>
    function drawRandomCard() {
      // 1. Instantly hide assets and toggle loader to give immediate tap feedback
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("pokemon-card").style.display = "none";
      document.getElementById("loading-status").style.display = "block";

      var currentUploadedTotal = 196; 
      var targetFolder = "30th_Celebration"; 
      
      var randomNumber = Math.floor(Math.random() * currentUploadedTotal) + 1;
      var paddedNumber = String(randomNumber).padStart(4, '0');
      var imageFilename = paddedNumber + ".png";
      
      var imgElement = document.getElementById("pokemon-card");
      imgElement.src = "./" + targetFolder + "/" + imageFilename;
      
      // 2. Display the card only after it has fully downloaded over data
      imgElement.onload = function() {
        document.getElementById("loading-status").style.display = "none";
        imgElement.style.display = "block";
      };
    }
  </script>
</head>
<body>

  <div class="card-container">
    <!-- START SCREEN COVER IMAGE -->
    <img id="start-screen" 
         src="./30th_Celebration/Start_30th_Celebration.jpg" 
         alt="Start Celebration Engine" 
         onclick="drawRandomCard()" />

    <!-- LOADER STATE (Stops users from seeing a broken image icon while it downloads) -->
    <div id="loading-status" class="loader" style="display: none;">
      <h2>⚡ Catching...</h2>
    </div>

    <!-- MAIN RANDOM CARD VIEW -->
    <img id="pokemon-card" src="" alt="Pokémon Card" style="display: none;" onclick="drawRandomCard()" />
  </div>

  <!-- FIXED BOTTOM BUTTON FOOTER -->
  <div class="footer-wrapper">
    <a class="download-btn" href="./30th_Celebration/Card_List_30th_Celebration.pdf" download>
      📄 Download Card List (PDF)
    </a>
  </div>

</body>
</html>
