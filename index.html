<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Random Pokémon Card</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      height: 100dvh; 
      width: 100vw;
      margin: 0;
      overflow: hidden;
      padding-top: 15px;
      padding-left: 15px;
      padding-right: 15px;
      padding-bottom: env(safe-area-inset-bottom, 15px); 
      position: relative;
    }

    .card-container {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 0; 
      position: relative;
    }

    img {
      max-width: 100%;
      max-height: 55vh; 
      max-height: 55dvh;
      object-fit: contain;
      box-shadow: 0 15px 50px rgba(0,0,0,0.8);
      border-radius: 4.5% / 3.5%;
      transition: transform 0.1s ease;
      z-index: 5;
    }

    #start-screen {
      cursor: pointer;
    }
    #start-screen:active {
      transform: scale(0.95); 
    }

    /* SMOOTH ZOOP FADE-IN */
    .fade-in {
      animation: fadeInEffect 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes fadeInEffect {
      from {
        opacity: 0;
        transform: scale(0.85);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    #pokemon-card {
      cursor: default;
      opacity: 0;
    }

    .loader {
      text-align: center;
      color: #aaa;
      font-weight: bold;
    }

    .sparkle {
      position: absolute;
      pointer-events: none;
      z-index: 99;
      animation: magicBurst 1.5s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
    }

    @keyframes magicBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) translate(0, 0) scale(1) rotate(0deg);
      }
      30% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) translateY(120px) scale(0) rotate(540deg);
      }
    }

    .footer-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
      margin-bottom: 15px;
      flex-shrink: 0;
      z-index: 10;
    }

    .download-btn {
      padding: 12px 20px;
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      text-decoration: none;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    /* ACTION BUTTONS UNDER REVEALED CARD */
    .card-actions {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      z-index: 10;
    }

    .action-btn {
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #catch-btn { background-color: #ff3e3e; color: white; }
    #save-btn { background-color: #3e8eff; color: white; }
    .action-btn:disabled { background-color: #555 !important; color: #888; cursor: not-allowed; }

    /* SLIDE-OUT CHECKLIST PANEL */
    .checklist-panel {
      position: fixed;
      top: 0;
      right: -100%;
      width: 85%;
      max-width: 360px;
      height: 100%;
      background-color: #111;
      border-left: 1px solid #333;
      z-index: 100;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    .checklist-panel.open { right: 0; }
    .checklist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    .checklist-scroll {
      flex: 1;
      overflow-y: auto;
      margin-top: 15px;
      padding-right: 5px;
    }
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid #222;
    }
    .checklist-item input { width: 20px; height: 20px; cursor: pointer; }

    #pdf-view-screen {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 0;
      z-index: 20;
    }

    .pdf-frame {
      width: 100%;
      flex: 1;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background-color: #111;
      margin-bottom: 15px;
    }

    .back-btn-container {
      width: 100%;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 15px;
    }
  </style>
  <script>
    // Global tracking settings
    var currentUploadedTotal = 196; 
    var targetFolder = "30th_Celebration";
    var activeCardNum = null; // Stores current card integer

    // Load checklist array from LocalStorage, or build clean list if empty
    var caughtCollection = JSON.parse(localStorage.getItem('pokemonChecklist')) || [];

    function launchHugeCelebration() {
      var container = document.getElementById("card-wrapper");
      var particleCount = 60; 

      for (var i = 0; i < particleCount; i++) {
        var sparkle = document.createElement("div");
        sparkle.classList.add("sparkle");

        var colors = [
          { main: "#ffd700", glow: "rgba(255, 215, 0, 0.9)" },
          { main: "#00f0ff", glow: "rgba(0, 240, 255, 0.9)" },
          { main: "#ff007f", glow: "rgba(255, 0, 127, 0.9)" },
          { main: "#ffffff", glow: "rgba(255, 255, 255, 0.9)" }
        ];
        var config = colors[Math.floor(Math.random() * colors.length)];
        
        sparkle.style.backgroundColor = config.main;
        sparkle.style.boxShadow = "0 0 15px " + config.glow + ", 0 0 30px " + config.glow;

        if (Math.random() > 0.5) {
          sparkle.style.borderRadius = "0%";
          sparkle.style.transform = "rotate(" + (Math.random() * 360) + "deg)"; 
        } else {
          sparkle.style.borderRadius = "50%";
        }

        var size = Math.floor(Math.random() * 16) + 8;
        sparkle.style.width = size + "px";
        sparkle.style.height = size + "px";

        var angle = Math.random() * Math.PI * 2;
        var velocity = 150 + Math.random() * 230; 
        var dx = Math.cos(angle) * velocity + "px";
        var dy = Math.sin(angle) * velocity + "px";

        sparkle.style.setProperty("--dx", dx);
        sparkle.style.setProperty("--dy", dy);

        sparkle.style.left = "50%";
        sparkle.style.top = "50%";
        sparkle.style.animationDelay = (Math.random() * 0.2) + "s";

        container.appendChild(sparkle);
        cleanUpSparkle(sparkle);
      }
    }

    function cleanUpSparkle(element) {
      setTimeout(function() {
        if (element && element.parentNode) {
          element.parentNode.removeChild(element);
        }
      }, 1700);
    }

    function drawRandomCard() {
      var catchSound = document.getElementById("catch-sound");

      catchSound.play().then(function() {
        catchSound.pause();
        catchSound.currentTime = 0;
      }).catch(function(e) {
        console.log("Pre-activation skipped", e);
      });

      document.getElementById("start-screen").style.display = "none";
      document.getElementById("pokemon-card").style.display = "none";
      document.getElementById("card-actions-container").style.display = "none";
      document.getElementById("loading-status").style.display = "block";
      
      // Select Random Card
      activeCardNum = Math.floor(Math.random() * currentUploadedTotal) + 1;
      var paddedNumber = String(activeCardNum).padStart(4, '0');
      var imageFilename = paddedNumber + ".png";
      
      var imgElement = document.getElementById("pokemon-card");
      imgElement.src = "./" + targetFolder + "/" + imageFilename;
      
      imgElement.onload = function() {
        document.getElementById("loading-status").style.display = "none";
        
        catchSound.play().catch(function(error) {
          console.log("Audio blocked: ", error);
        });

        imgElement.style.display = "block";
        imgElement.classList.add("fade-in");
        
        // Show buttons & adjust status based on collection
        document.getElementById("card-actions-container").style.display = "flex";
        updateCatchButtonUI();

        launchHugeCelebration();
      };
    }

    // Adjust Action Button Text based on item tracking array
    function updateCatchButtonUI() {
      var catchBtn = document.getElementById("catch-btn");
      if (caughtCollection.includes(activeCardNum)) {
        catchBtn.innerText = "✨ Already Caught!";
        catchBtn.disabled = true;
      } else {
        catchBtn.innerText = "🔴 Catch Card";
        catchBtn.disabled = false;
      }
    }

    // Trigger explicit browser down-link generation 
    function saveCardImage() {
      if (!activeCardNum) return;
      var paddedNumber = String(activeCardNum).padStart(4, '0');
      var link = document.createElement('a');
      link.href = document.getElementById("pokemon-card").src;
      link.download = "Pokemon_Card_" + paddedNumber + ".png";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Track a card and play catch audio sequence
    function collectCurrentCard() {
      if (!activeCardNum) return;
      if (!caughtCollection.includes(activeCardNum)) {
