<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Random Pokémon Card</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      height: 100dvh; 
      width: 100vw;
      margin: 0;
      overflow: hidden;
      padding-top: 20px;
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: env(safe-area-inset-bottom, 50px); 
    }

    .card-container {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0; 
    }

    img {
      max-width: 100%;
      max-height: 65vh; 
      max-height: 65dvh;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border-radius: 4.5% / 3.5%;
      transition: transform 0.1s ease;
    }

    #start-screen {
      cursor: pointer;
    }
    #start-screen:active {
      transform: scale(0.97); 
    }

    /* 1. FADE-IN CLASS: Applied dynamically via JavaScript once the image finishes loading */
    .fade-in {
      animation: fadeInEffect 0.6s ease-out forwards;
    }

    @keyframes fadeInEffect {
      from {
        opacity: 0;
        transform: scale(0.93); /* Slight growth pop effect as it appears */
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    #pokemon-card {
      cursor: default;
      opacity: 0; /* Keep hidden until animation class kicks in */
    }

    .loader {
      text-align: center;
      color: #aaa;
      font-weight: bold;
    }

    .footer-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 20px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .download-btn {
      padding: 14px 28px;
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      text-decoration: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
  </style>
  <script>
    function drawRandomCard() {
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("pokemon-card").style.display = "none";
      document.getElementById("loading-status").style.display = "block";

      var currentUploadedTotal = 196; 
      var targetFolder = "30th_Celebration"; 
      
      var randomNumber = Math.floor(Math.random() * currentUploadedTotal) + 1;
      var paddedNumber = String(randomNumber).padStart(4, '0');
      var imageFilename = paddedNumber + ".png";
      
      var imgElement = document.getElementById("pokemon-card");
      imgElement.src = "./" + targetFolder + "/" + imageFilename;
      
      imgElement.onload = function() {
        document.getElementById("loading-status").style.display = "none";
        
        // 2. Play the catch sound effect exactly when the image displays
        var catchSound = document.getElementById("catch-sound");
        catchSound.play().catch(function(error) {
          console.log("Audio playback blocked by mobile browser privacy settings until next user interaction.");
        });

        // 3. Make the image block visible and add the smooth CSS animation class
        imgElement.style.display = "block";
        imgElement.classList.add("fade-in");
      };
    }
  </script>
</head>
<body>

  <!-- Audio asset definition -->
  <audio id="catch-sound" src="./catch.mp3" preload="auto"></audio>

  <div class="card-container">
    <img id="start-screen" 
         src="./30th_Celebration/Start_30th_Celebration.jpg" 
         alt="Start Celebration Engine" 
         onclick="drawRandomCard()" />

    <div id="loading-status" class="loader" style="display: none;">
      <h2>⚡ Catching...</h2>
    </div>

    <img id="pokemon-card" src="" alt="Pokémon Card" style="display: none;" />
  </div>

  <div class="footer-wrapper">
    <a class="download-btn" href="./30th_Celebration/Card_List_30th_Celebration.pdf" download>
      📄 Download Card List (PDF)
    </a>
  </div>

</body>
</html>
