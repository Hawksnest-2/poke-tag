<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Pokémon Card</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      margin: 0;
      overflow: hidden;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .loader {
      text-align: center;
      color: #888;
    }
  </style>
  <script>
    window.onload = function() {
      // NOTE: Change this number to match exactly how many images you currently have uploaded!
      // For example, keep it at 100 while testing, then change it to 3369 once they are all uploaded.
      var currentUploadedTotal = 100; 
      
      // 1. Instantly choose a random card number
      var randomNumber = Math.floor(Math.random() * currentUploadedTotal) + 1;
      var paddedNumber = String(randomNumber).padStart(4, '0');
      var imageFilename = paddedNumber + ".png";
      
      // 2. NATIVE PATH: Looks directly inside your newly created /images/ subfolder
      var imgElement = document.getElementById("pokemon-card");
      imgElement.src = "./images/" + imageFilename;
      
      // 3. Hide the loading status text and fade the card onto the screen layout
      document.getElementById("loading-status").style.display = "none";
      imgElement.style.display = "block";
    };
  </script>
</head>
<body>

  <div id="loading-status" class="loader">
    <h2>⚡ Drawing Card...</h2>
  </div>

  <!-- The image container layer starts hidden and reveals itself instantly once loaded -->
  <img id="pokemon-card" src="" alt="Pokémon Card" style="display: none;" />

</body>
</html>
