<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Random Pokémon Card</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      height: 100dvh; 
      width: 100vw;
      margin: 0;
      overflow: hidden;
      padding-top: 20px;
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: env(safe-area-inset-bottom, 50px); 
    }

    .card-container {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0; 
      position: relative; /* Crucial for positioning sparkles around the card */
    }

    img {
      max-width: 100%;
      max-height: 65vh; 
      max-height: 65dvh;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border-radius: 4.5% / 3.5%;
      transition: transform 0.1s ease;
      z-index: 2; /* Keeps the card cleanly on top of the background */
    }

    #start-screen {
      cursor: pointer;
    }
    #start-screen:active {
      transform: scale(0.97); 
    }

    .fade-in {
      animation: fadeInEffect 0.6s ease-out forwards;
    }

    @keyframes fadeInEffect {
      from {
        opacity: 0;
        transform: scale(0.93);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    #pokemon-card {
      cursor: default;
      opacity: 0;
    }

    .loader {
      text-align: center;
      color: #aaa;
      font-weight: bold;
    }

    /* 1. SPARKLE PARTICLE STYLES */
    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      background-color: #ffd700; /* Gold sparkles */
      border-radius: 50%;
      pointer-events: none; /* Stops sparkles from blocking finger taps */
      z-index: 3; /* Spawns sparkles directly in front of the card */
      opacity: 0;
    }

    /* Alternate shapes/colors for visual variety */
    .sparkle:nth-child(even) {
      background-color: #ffffff; /* White diamonds */
      border-radius: 0%;
      transform: rotate(45deg);
    }

    .sparkle-burst {
      animation: scatterParticle 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes scatterParticle {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }
      100% {
        /* CSS variables (--x and --y) are injected dynamically via JS below */
        transform: translate(var(--x), var(--y)) scale(0) rotate(360deg);
        opacity: 0;
      }
    }

    .footer-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 20px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .download-btn {
      padding: 14px 28px;
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      text-decoration: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
  </style>
  <script>
    // 2. SPARKLE GENERATOR ENGINE
    function createSparkles() {
      var container = document.getElementById("card-wrapper");
      var particleCount = 30; // Number of sparkles to shoot out

      for (var i = 0; i < particleCount; i++) {
        var sparkle = document.createElement("div");
        sparkle.classList.add("sparkle");

        // Calculate a random circular direction and distance to explode outward
        var angle = Math.random() * Math.PI * 2;
        var distance = 80 + Math.random() * 120; // Distance in pixels
        var x = Math.cos(angle) * distance + "px";
        var y = Math.sin(angle) * distance + "px";

        // Assign the random coordinates to the CSS variables
        sparkle.style.setProperty("--x", x);
        sparkle.style.setProperty("--y", y);

        // Randomize slight spawn offsets so they pop out from the center of the card area
        sparkle.style.left = "calc(50% + " + (Math.random() * 40 - 20) + "px)";
        sparkle.style.top = "calc(50% + " + (Math.random() * 40 - 20) + "px)";

        // Randomize micro-delays so they explode in a wave rather than all at once
        sparkle.style.animationDelay = (Math.random() * 0.15) + "s";

        container.appendChild(sparkle);
        sparkle.classList.add("sparkle-burst");

        // Automatically clean up the sparkle elements from memory after the animation finish line
        removeSparkleElement(sparkle);
      }
    }

    function removeSparkleElement(element) {
      setTimeout(function() {
        element.remove();
      }, 1000);
    }

    function drawRandomCard() {
      var catchSound = document.getElementById("catch-sound");

      catchSound.play().then(function() {
        catchSound.pause();
        catchSound.currentTime = 0;
      }).catch(function(e) {
        console.log("Pre-activation skipped", e);
      });

      document.getElementById("start-screen").style.display = "none";
      document.getElementById("pokemon-card").style.display = "none";
      document.getElementById("loading-status").style.display = "block";

      var currentUploadedTotal = 196; 
      var targetFolder = "30th_Celebration"; 
      
      var randomNumber = Math.floor(Math.random() * currentUploadedTotal) + 1;
      var paddedNumber = String(randomNumber).padStart(4, '0');
      var imageFilename = paddedNumber + ".png";
      
      var imgElement = document.getElementById("pokemon-card");
      imgElement.src = "./" + targetFolder + "/" + imageFilename;
      
      imgElement.onload = function() {
        document.getElementById("loading-status").style.display = "none";
        
        catchSound.play().catch(function(error) {
          console.log("Audio blocked: ", error);
        });

        imgElement.style.display = "block";
        imgElement.classList.add("fade-in");

        // 3. TRIGGER SPARKLES right as the image hits the screen!
        createSparkles();
      };
    }
  </script>
</head>
<body>

  <audio id="catch-sound" src="./catch.mp3" preload="auto"></audio>

  <!-- Added an explicit ID wrapper here to anchor particle injection math -->
  <div id="card-wrapper" class="card-container">
    <img id="start-screen" 
         src="./30th_Celebration/Start_30th_Celebration.jpg" 
         alt="Start Celebration Engine" 
         onclick="drawRandomCard()" />

    <div id="loading-status" class="loader" style="display: none;">
      <h2>⚡ Catching...</h2>
    </div>

    <img id="pokemon-card" src="" alt="Pokémon Card" style="display: none;" />
  </div>

  <div class="footer-wrapper">
    <a class="download-btn" href="./30th_Celebration/Card_List_30th_Celebration.pdf" download>
      📄 Download Card List (PDF)
    </a>
  </div>

</body>
</html>
