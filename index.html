<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Pokémon Card</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      margin: 0;
      overflow: hidden;
      position: relative;
    }
    .card-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 85vh;
      width: 100%;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    /* Add a pointer hand icon over the images to show they are clickable */
    #start-screen, #pokemon-card {
      cursor: pointer;
    }
    .loader {
      text-align: center;
      color: #888;
    }
    .download-btn {
      margin-bottom: 20px;
      padding: 10px 20px;
      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      text-decoration: none;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }
    .download-btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.5);
    }
  </style>
  <script>
    function drawRandomCard() {
      // 1. Hide the Start Screen / display the loader
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("pokemon-card").style.display = "none";
      document.getElementById("loading-status").style.display = "block";

      // 2. Set file configurations
      var currentUploadedTotal = 196; 
      var targetFolder = "30th_Celebration"; 
      
      // 3. Generate random padded number
      var randomNumber = Math.floor(Math.random() * currentUploadedTotal) + 1;
      var paddedNumber = String(randomNumber).padStart(4, '0');
      var imageFilename = paddedNumber + ".png";
      
      // 4. Update the source image
      var imgElement = document.getElementById("pokemon-card");
      imgElement.src = "./" + targetFolder + "/" + imageFilename;
      
      // 5. Reveal the new randomized card asset once fully downloaded
      imgElement.onload = function() {
        document.getElementById("loading-status").style.display = "none";
        imgElement.style.display = "block";
      };
    }
  </script>
</head>
<body>

  <div class="card-container">
    <!-- 1. START SCREEN IMAGE (Visible by default) -->
    <img id="start-screen" 
         src="./30th_Celebration/Start_30th_Celebration.jpg" 
         alt="Start Celebration Engine" 
         onclick="drawRandomCard()" />

    <!-- 2. LOADING STATE STATUS (Hidden initially) -->
    <div id="loading-status" class="loader" style="display: none;">
      <h2>⚡ Drawing Card...</h2>
    </div>

    <!-- 3. MAIN DYNAMIC CARD VIEW (Hidden initially, re-clicking draws a fresh random card) -->
    <img id="pokemon-card" src="" alt="Pokémon Card" style="display: none;" onclick="drawRandomCard()" />
  </div>

  <!-- 4. FIXED DOWNLOAD UTILITY FOOTER -->
  <a class="download-btn" href="./30th_Celebration/Card_List_30th_Celebration.pdf" download>
    📄 Download Card List (PDF)
  </a>

</body>
</html>
